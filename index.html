/* ── PROFESSIONAL NAVBAR ─────────────────────────────────── */
.site-header{
  position:sticky;top:0;z-index:100;
  width:100%;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(219,230,243,.8);
  box-shadow:0 1px 20px rgba(7,26,63,.06);
}
.site-header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0;
  width:100%;
  max-width:none;
  /* Match hero left-col padding exactly: hero-v2-left uses padding-left:48px on ≥900px, 72px on ≥1100px */
  padding:0 72px;
  height:70px;
  box-sizing:border-box;
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  flex-shrink:0;text-decoration:none;
}
.brand-mark{
  display:grid;place-items:center;
  width:36px;height:36px;border-radius:10px;
  background:var(--primary);
  color:#fff;font-size:16px;font-weight:800;line-height:1;flex-shrink:0;
}
.brand strong{
  display:block;font-size:14.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:#0b4a99;
}
.brand small{
  display:block;margin-top:1px;color:var(--muted);
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
/* Nav links — right side */
.site-nav{
  display:none;
  align-items:center;
  gap:2px;
  margin:0;padding:0;list-style:none;
  margin-left:auto;
}
.site-nav a{
  display:inline-block;
  padding:7px 16px;
  border-radius:7px;
  color:#333;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  transition:background .14s,color .14s;
  white-space:nowrap;position:relative;
}
.site-nav a:hover{
  background:rgba(11,74,153,.07);color:var(--primary);
}
.site-nav a.is-active{
  color:var(--primary);
}
.site-nav a.is-active::after{
  content:'';
  position:absolute;bottom:-2px;left:12px;right:12px;
  height:2px;border-radius:999px;
  background:var(--primary);
}
/* CTA button */
.nav-cta-wrap{
  display:none;
  align-items:center;gap:0;
  margin-left:5px;flex-shrink:0;
}
.nav-divider{
  width:1px;height:20px;background:var(--line);
  margin-right:20px;flex-shrink:0;
}
.header-cta{
  display:inline-flex;
  align-items:center;gap:7px;
  padding:9px 18px;
  border-radius:9px;
  background:var(--primary);
  color:#fff;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:700;
  border:none;cursor:pointer;
  box-shadow:0 4px 14px rgba(11,74,153,.24);
  transition:background .15s,transform .14s,box-shadow .14s;
  text-decoration:none;white-space:nowrap;
}
.header-cta:hover{
  background:var(--primaryDark);transform:translateY(-1px);
  box-shadow:0 8px 22px rgba(11,74,153,.32);
}
.header-cta svg{
  width:14px;height:14px;stroke:#fff;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
}
/* Hamburger */
.nav-toggle{
  display:inline-grid;place-items:center;
  width:38px;height:38px;
  border:1px solid var(--line);border-radius:8px;
  color:var(--primary);background:var(--white);cursor:pointer;
  margin-left:auto;flex-shrink:0;
}
/* Desktop: show nav + CTA, hide hamburger */
@media(min-width:980px){
  .site-nav{display:flex;}
  .nav-cta-wrap{display:flex;}
  .nav-toggle{display:none;}
}
/* Tablet/mobile */
@media(max-width:979px){
  .site-header-inner{padding:0 20px;height:60px;}
  .site-nav{
    display:none;
    position:absolute;top:60px;left:0;right:0;
    flex-direction:column;align-items:stretch;
    background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 24px rgba(7,26,63,.09);
    padding:8px 16px 16px;z-index:99;margin-left:0;
  }
  .site-nav.is-open{display:flex;}
  .site-nav a{padding:12px 12px;border-radius:8px;font-size:15px;}
  .site-nav a.is-active::after{display:none;}
  .nav-cta-wrap{display:none;}
  .nav-toggle{margin-left:auto;}
}
/* ── END NAVBAR ──────────────────────────────────────────── */

/* ── ABOUT SECTION MOBILE ─────────────────────────────────── */
/* On mobile: eyebrow + heading first, then image, then text + stats */
@media(max-width:979px){
  .section.about{
    display:flex !important;
    flex-direction:column !important;
    gap:0 !important;
  }
  /* Text column: split into header part and body part */
  .section.about .section-copy{
    display:contents; /* unwrap so children can be individually ordered */
  }
  .section.about .section-copy .eyebrow{ order:1; margin-bottom:8px; }
  .section.about .section-copy h2{      order:2; margin-bottom:0; }
  .section.about .about-media{          order:3; margin:20px 0; }
  .section.about .section-copy p{       order:4; }
  .section.about .section-copy .check-list{ order:5; }

  /* Stats panel: force 3-col horizontal row */
  .stats-panel{
    grid-template-columns:repeat(3,1fr) !important;
    gap:0 !important;
  }
  .stats-panel li{
    border-right:1px solid var(--line) !important;
    border-bottom:0 !important;
    padding-bottom:0 !important;
  }
  .stats-panel li:last-child{ border-right:0 !important; }
}
@media(max-width:480px){
  .stats-panel{ padding:10px 8px !important; }
  .stats-panel strong{ font-size:20px !important; }
  .stats-panel span:last-child{ font-size:11px !important; }
  .stats-panel li{ padding:0 4px !important; }
}
/* ── END ABOUT MOBILE ─────────────────────────────────────── */
/* All sections share the hero's horizontal padding */
.section{
  padding-left:72px !important;
  padding-right:72px !important;
  max-width:none;
  box-sizing:border-box;
}
@media(max-width:979px){
  .section{padding-left:20px !important;padding-right:20px !important;}
}

/* About image — fixed height, no overflow */
.about-image{
  display:block;
  width:100%;
  height:470px !important;
  min-height:unset !important;
  max-height:unset !important;
  object-fit:cover;
  border-radius:16px;
  overflow:hidden;
}
div.about-image{
  height:470px !important;
}
/* Stats panel — sits cleanly below image, no negative margin */
.stats-panel{
  position:static !important;
  margin:18px 0 0 !important;
  width:100% !important;
  border-radius:14px !important;
  border:1px solid var(--line) !important;
  box-shadow:0 8px 28px rgba(7,26,63,.08) !important;
}
@media(max-width:700px){
  .about-image,div.about-image{height:260px !important;}
  /* stats panel stays 3-col — overridden above in the about-mobile block */
}
/* About section — image on left, content on right (desktop) */
@media(min-width:980px){
  .section.about{ grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr) !important; }
  .section.about .about-media{ order:1; }
  .section.about .section-copy{ order:2; }
}
/* ── END SECTION + ABOUT ALIGNMENT ──────────────────────── */

/* ── REDESIGNED HERO v3 — Mobile-First Gradient Fade ──────── */
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap');

/* ════════════════════════════════════════════
   BASE HERO — shared across breakpoints
════════════════════════════════════════════ */
.hero-v2{
  position:relative;
  width:100%;
  overflow:hidden;
  display:flex;
  align-items:flex-end; /* content anchors to bottom on mobile */
}

/* Picture / image fills the entire hero */
.hero-v2 picture{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}
.hero-v2-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
  z-index:0;
}

/* Placeholder when no image */
.hero-v2-placeholder{
  position:absolute;
  inset:0;
  z-index:0;
  background:linear-gradient(145deg,#0d2a5e 0%,#1a4b8c 45%,#2f7bbf 100%);
  display:flex;align-items:center;justify-content:center;
}
.hero-v2-placeholder-inner{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  opacity:.35;color:#fff;
}
.hero-v2-placeholder-inner svg{ width:90px;height:90px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round; }
.hero-v2-placeholder-inner span{ font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#fff; }

/* Hide unused elements */
.hero-v2-right,.hero-v2-card,.hero-v2-badge,.hero-v2-blob1,.hero-v2-blob2,.hero-v2-curve,.hero-v2-img-overlay{ display:none; }

/* ════════════════════════════════════════════
   MOBILE HERO (≤768px) — Primary design
   Full-viewport, gradient fade from bottom
════════════════════════════════════════════ */
.hero-v2{
  min-height:90svh;
}

/* The gradient overlay — white at bottom fading to transparent at ~57% */
.hero-v2::after{
  content:'';
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(
    to top,
    rgba(255,255,255,0.97) 0%,
    rgba(255,255,255,0.92) 20%,
    rgba(255,255,255,0.70) 40%,
    rgba(255,255,255,0.20) 65%,
    rgba(255,255,255,0)    85%
  );
  pointer-events:none;
}

/* Content — sits in bottom 40%, above gradient */
.hero-v2-left{
  position:relative;
  z-index:2;
  width:100%;
  max-width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0 24px 60px;
}

/* Eyebrow */
.hero-v2-eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 16px;
  color:#0b4a99;
}
.hero-v2-eyebrow-line{
  display:block;
  width:40px;
  height:1px;
  background:#0b4a99;
  flex-shrink:0;
}
.hero-v2-eyebrow-text{
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:#0b4a99;
  white-space:nowrap;
}

/* Headline */
.hero-v2-h1{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(32px,8vw,55px);
  line-height:1.08;
  color:#071a3f;
  margin:0 0 14px;
  font-weight:400;
}
.hero-v2-h1 em{
  font-style:italic;
  color:#0b4a99;
}

/* Subtext */
.hero-v2-sub{
  font-family:Inter,Arial,sans-serif;
  font-size:16px;
  line-height:1.65;
  color:#3d4a5c;
  max-width:100%;
  margin:0 0 24px;
}

/* CTA row */
.hero-v2-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

/* Primary CTA */
.hero-v2-btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 10px;
  border-radius:10px;
  background:var(--primary,#0b4a99);
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  border:none;cursor:pointer;
  box-shadow:0 6px 22px rgba(11,74,153,.30);
  transition:transform .18s ease,box-shadow .18s ease,background .18s;
  text-decoration:none;
  flex:1;
  justify-content:center;
  min-width:0;
}
.hero-v2-btn-primary:hover{
  background:var(--primaryDark,#07306c);
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(11,74,153,.38);
}
.hero-v2-btn-primary svg{
  width:15px;height:15px;stroke:#fff;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
}
.hero-v2-btn-primary svg.icon-whatsapp{
  fill:#fff;stroke:none;width:17px;height:17px;
}

/* Secondary CTA */
.hero-v2-btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 10px;
  border-radius:10px;
  background:rgba(166,139,75,.08);
  border:1.5px solid #0b4a99;
  color:#0b4a99;
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .18s ease;
  text-decoration:none;
  flex:0 0 auto;
  justify-content:center;
  white-space:nowrap;
}
.hero-v2-btn-ghost:hover{
  transform:translateY(-1px);
}
.hero-v2-btn-ghost svg{
  width:15px;height:15px;stroke:#0b4a99;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
}

/* Buttons always sit side-by-side; primary grows, ghost stays content-width */

/* Fade-in animations */
/* .hero-v2-eyebrow animation removed — eyebrow element no longer rendered */
.hero-v2-h1     { animation:heroFadeUp .5s .13s both cubic-bezier(.22,.68,0,1.2); }
.hero-v2-sub    { animation:heroFadeUp .5s .20s both cubic-bezier(.22,.68,0,1.2); }
.hero-v2-actions{ animation:heroFadeUp .5s .27s both cubic-bezier(.22,.68,0,1.2); }
@keyframes heroFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════════════════════════════════
   TABLET (769px–899px) — slightly wider padding
════════════════════════════════════════════ */
@media(min-width:769px) and (max-width:899px){
  .hero-v2-left{ padding:0 32px 48px; }
  .hero-v2-h1{ font-size:clamp(36px,6vw,48px); }
}

/* ════════════════════════════════════════════
   DESKTOP (≥1181px) — side-by-side layout
════════════════════════════════════════════ */
@media(min-width:1181px){
  .hero-v2{
    min-height:calc(100vh - 70px);
    align-items:center; /* vertically center on desktop */
  }
  /* On desktop, gradient covers left half so text is legible */
  .hero-v2::after{
    background:linear-gradient(
      to right,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.90) 20%,
      rgba(255,255,255,0.55) 35%,
      rgba(255,255,255,0)    50%
    );
  }
  .hero-v2-left{
    max-width:min(780px, 56%);
    padding:90px 48px 90px 72px;
    justify-content:center;
  }
  .hero-v2-sub{ max-width:500px; }
  .hero-v2-btn-primary,
  .hero-v2-btn-ghost{
    flex:0 0 auto;
    min-width:0;
  }
}
@media(min-width:1181px){
  .hero-v2-left{ padding:90px 56px 90px 72px; }
}

/* ── Tablet (769px–1180px) — dedicated tab image, content anchored bottom ── */
@media(min-width:769px) and (max-width:1180px){
  /* Tab image is purpose-built so no horizontal shifting needed */
  .hero-v2-bg{
    object-position:center top;
  }
  /* Content sits at the bottom like mobile — tall portrait viewport has room */
  .hero-v2{
    align-items:flex-end;
  }
  /* Gradient fades bottom-up like mobile, not left-right */
  .hero-v2::after{
    background:linear-gradient(
      to top,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.90) 22%,
      rgba(255,255,255,0.55) 42%,
      rgba(255,255,255,0.10) 60%,
      rgba(255,255,255,0)    75%
    );
  }
  /* Text sits full-width at the bottom with generous side padding */
  .hero-v2-left{
    max-width:700px;
    width:100%;
    padding:0 48px 68px;
  }
  .hero-v2-h1{
    font-size:clamp(36px,5vw,52px);
  }
  .hero-v2-sub{
    max-width:520px;
  }
}
/* ── END HERO v3 ─────────────────────────────────────────────── */

#wizBack3 .icon,

/* ── SECTION SEPARATORS — bottom shadow ─────────────────── */
.section,
.section.compact,
.section.process,
.section.faq{
  box-shadow: 0 14px 40px -8px rgba(7,26,63,.07);
  position: relative;
  z-index: 1;
}

/* ── TRUST / STATS BAND ───────────────────────────────────── */
.trust-band{
  position: relative;
  overflow: hidden;
  padding: 108px 20px 140px;
  background: linear-gradient(180deg, #fbfdff 0%, var(--surface) 100%);
}
.trust-band-bg{
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.trust-dots{
  position: absolute;
  width: 128px;
  height: 96px;
  background-image: radial-gradient(var(--line) 1.6px, transparent 1.6px);
  background-size: 16px 16px;
  opacity: .8;
}
.trust-dots--tl{ top: 22px; left: 26px; }
.trust-dots--br{ bottom: 22px; right: 26px; }
.trust-blob{
  position: absolute;
  border-radius: 50%;
  filter: blur(46px);
  opacity: .32;
}
.trust-blob--a{
  width: 300px; height: 300px;
  left: -100px; bottom: -130px;
  background: radial-gradient(circle, var(--accent), transparent 70%);
}
.trust-blob--b{
  width: 260px; height: 260px;
  right: -90px; top: -120px;
  background: radial-gradient(circle, var(--primary), transparent 70%);
}
.trust-band-inner{
  position: relative;
  z-index: 1;
  display: grid;
  gap: 56px 28px;
  max-width: var(--container);
  margin: 0 auto;
}
.trust-card{
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 254px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 68px 30px 46px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(7,26,63,.07);
  transition: transform .2s ease, box-shadow .2s ease;
}
.trust-card:hover{
  transform: translateY(-4px);
  box-shadow: 0 26px 60px rgba(7,26,63,.11);
}
.trust-icon{
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  place-items: center;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--white);
  box-shadow: 0 14px 30px rgba(7,26,63,.13);
  color: var(--primary);
}
.trust-icon .icon{ width: 36px; height: 36px; }
.trust-value{
  display: block;
  margin-top: 10px;
  font-family: Inter, Arial, sans-serif;
  font-weight: 800;
  font-size: clamp(34px, 5.5vw, 46px);
  line-height: 1;
  letter-spacing: -.01em;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--primary);
}
.trust-label{
  display: block;
  margin-top: 16px;
  color: #334155;
  font-size: 16px;
  font-weight: 600;
}
.trust-underline{
  display: block;
  width: 40px;
  height: 3px;
  margin: 20px auto 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
}
@media (min-width: 720px){
  .trust-band-inner{ grid-template-columns: repeat(3, minmax(0,1fr)); gap: 30px; }
}
@media (max-width: 520px){
  .trust-band{ padding: 76px 16px 96px; }
  .trust-card{ min-height: 214px; padding: 58px 24px 38px; }
  .trust-dots{ width: 84px; height: 64px; }
}
/* ── END TRUST BAND ───────────────────────────────────────── */



/* ── SERVICES: 8-card grid, 2-col on mobile ──────────────── */
.services-grid{
  grid-template-columns: repeat(2, minmax(0,1fr));
}
@media(min-width:720px){
  .services-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(min-width:980px){

}
.service-card{
  display:flex;flex-direction:column;border-radius:20px;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
a.service-card:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 50px rgba(7,26,63,.12);
  border-color:rgba(11,74,153,.25);
}
.service-card p{
  flex:1;font-size:13px;
}
.service-card-btn{

  border:none;
  color:var(--primary);

.service-card-btn:hover{

}
.service-card-btn-icon{

}
.service-card-btn-icon svg{
  width:100%;height:100%;stroke:currentColor;fill:none;

}
/* ── END SERVICES ─────────────────────────────────────────── */

/* ── PROCESS: step-number round badge ────────────────────── */
.step-number{

}
.step-number-badge{

/* ── END PROCESS ──────────────────────────────────────────── */

/* ── FAQ: two-column layout desktop ──────────────────────── */
.faq{

.faq-left-image{

  section.faq{max-width:none;}

.faq-list{ display:flex; flex-direction:column; gap:0; }

/* Remove old faq-card styles that may conflict */
.faq-card, .faq-card__trigger, .faq-card__body,
.faq-card__q, .faq-card__icon, .faq-card__a { all:unset; }

/* Remove purple wrapper */
.faq-purple-wrap{ background:none; border-radius:0; overflow:visible; padding:0; }

.faq-row{
  border-bottom: 1px solid var(--line);
  background: transparent;
  overflow: hidden;
}
.faq-row:first-child{ border-top: 1px solid var(--line); }

.faq-row__trigger{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  width: 100%;
  padding: 20px 0;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}
.faq-row__q{
  font-size: 15.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
  flex: 1;
  transition: color .18s;
}
.faq-row--open .faq-row__q{ color: var(--primary); }

.faq-row__chevron{
  flex-shrink: 0;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px;
  background: #0b4a99;
  border: 1.5px solid var(--line);
  color: #ffffff;
  transition: background .2s, border-color .2s, color .2s;
}
.faq-row__chevron svg{
  width: 16px; height: 16px;
  stroke: currentColor;
  transition: transform .28s ease;
}
.faq-row--open .faq-row__chevron{
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.faq-row--open .faq-row__chevron svg{ transform: rotate(180deg); }

/* CRITICAL: body collapses by default via grid trick */
.faq-row__body{
  display: grid !important;
  grid-template-rows: 0fr !important;
  transition: grid-template-rows .28s ease;
}
.faq-row--open .faq-row__body{
  grid-template-rows: 1fr !important;
}
.faq-row__body > div{ overflow: hidden; }

.faq-row__a{
  padding: 0 0 20px;
  margin: 0;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.75;
}

    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", seo.description);

    const base = (data.siteUrl || "").replace(/\/$/, "");
    const url = page === "home" ? `${base}/` : `${base}/?page=${page}`;

    const set = (id, attr, value) => {
      const el = document.getElementById(id);
      if (el) el.setAttribute(attr, value);
    };
    set("canonicalLink", "href", url);
    set("ogTitle", "content", seo.title);
    set("ogDescription", "content", seo.description);

  function bindUi() {
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.querySelector(".site-nav");
    if (toggle && nav) {
      toggle.addEventListener("click", () => {
        nav.classList.toggle("is-open");
        toggle.setAttribute("aria-expanded", nav.classList.contains("is-open"));
      });
    }
    document.querySelectorAll("form").forEach((form) => {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        form.classList.add("is-submitted");
      });
    });

    // Active nav link: scroll spy
    const navLinks = document.querySelectorAll(".site-nav a[data-section]");
    const sections = Array.from(navLinks)
      .map(a => document.getElementById(a.dataset.section))
      .filter(Boolean);

    function updateActive() {
      const scrollY = window.scrollY + 120;
      let current = sections[0];
      for (const sec of sections) {
        if (sec.offsetTop <= scrollY) current = sec;
      }
      navLinks.forEach(a => {
        a.classList.toggle("is-active", a.dataset.section === (current && current.id));
      });
    }
    if (sections.length) {
      window.addEventListener("scroll", updateActive, { passive: true });
      updateActive();
    }

    // FAQ row accordion
    document.querySelectorAll("[data-faq]").forEach(row => {
      const btn = row.querySelector(".faq-row__trigger");
      if (!btn) return;
      btn.addEventListener("click", () => {
        const isOpen = row.classList.contains("faq-row--open");
        document.querySelectorAll("[data-faq]").forEach(r => {
          r.classList.remove("faq-row--open");
          const b = r.querySelector(".faq-row__trigger");
          if (b) b.setAttribute("aria-expanded", "false");
        });
        if (!isOpen) {
          row.classList.add("faq-row--open");
          btn.setAttribute("aria-expanded", "true");
        }
      });
    });

    // 3-Step Booking Wizard
    const panes   = [null,
      document.getElementById("wizPane1"),
      document.getElementById("wizPane2"),
      document.getElementById("wizPane3"),
      document.getElementById("wizPane4")];
    const steps   = document.querySelectorAll(".wiz-step");
    const fill    = document.getElementById("wizFill");
    const summary = document.getElementById("wizSummary");

    if (!panes[1]) return; // not on booking page

    function showPane(n) {
      panes.forEach((p, i) => { if (i > 0) p.classList.toggle("wiz-pane--hidden", i !== n); });
      // update inline stepper dots
      document.querySelectorAll(".wiz-stepper-inline__step").forEach((s, i) => {
        const stepNum = i + 1;
        s.classList.toggle("wiz-stepper-inline__step--active", stepNum === n);
        s.classList.toggle("wiz-stepper-inline__step--done", stepNum < n);
      });
      // update connector lines
      const line1 = document.getElementById("wizLine1");
      const line2 = document.getElementById("wizLine2");
      if (line1) line1.classList.toggle("wiz-stepper-inline__line--done", n > 1);
      if (line2) line2.classList.toggle("wiz-stepper-inline__line--done", n > 2);
      const wizShell = document.querySelector(".wiz-shell");
      if (wizShell) {
        const offset = wizShell.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({ top: offset, behavior: "smooth" });
      }
    }

    function buildSummary() {
      if (!summary) return;
      const svc  = document.querySelector('input[name="service"]:checked');
      const date = { value: document.getElementById("bookDate") ? document.getElementById("bookDate").value : "—" };
      const time = document.querySelector('input[name="time"]:checked');
      const rows = [
        { label:"Service", val: svc  ? svc.value  : "—" },
        { label:"Date",    val: date ? date.value  : "—" },
        { label:"Time",    val: time ? time.value  : "—" }
      ].map(r => `<div class="wiz-summary-row"><strong>${r.label}</strong><span>${r.val}</span></div>`).join("");
      summary.innerHTML = rows;
      summary.classList.add("is-visible");
    }

    // Generate date buttons as a horizontal slider
    (function() {
      const row = document.getElementById("dateBtnRow");
      const slotGrid = document.getElementById("slotGrid");
      const prevBtn = document.getElementById("dateSliderPrev");
      const nextBtn = document.getElementById("dateSliderNext");
      if (!row || !slotGrid) return;

      const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

      // Build 14 date buttons for more scroll room
      const dates = [];
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        dates.push(d);
      }

      function pad(n){ return String(n).padStart(2,'0'); }
      function formatValue(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

      // Slider offset state
      let sliderIndex = 0;
      const BTN_WIDTH = 72; // 64px btn + 8px gap

      function getVisibleCount() {
        const track = document.querySelector(".date-slider-track");
        if (!track) return 4;
        return Math.floor(track.clientWidth / BTN_WIDTH);
      }

      function updateSlider() {
        const visible = getVisibleCount();
        const maxIndex = Math.max(0, dates.length - visible);
        sliderIndex = Math.min(sliderIndex, maxIndex);
        row.style.transform = `translateX(-${sliderIndex * BTN_WIDTH}px)`;
        if (prevBtn) prevBtn.style.opacity = sliderIndex === 0 ? "0.35" : "1";
        if (nextBtn) nextBtn.style.opacity = sliderIndex >= maxIndex ? "0.35" : "1";
        if (prevBtn) prevBtn.style.pointerEvents = sliderIndex === 0 ? "none" : "auto";
        if (nextBtn) nextBtn.style.pointerEvents = sliderIndex >= maxIndex ? "none" : "auto";
      }

      if (prevBtn) prevBtn.addEventListener("click", () => { sliderIndex = Math.max(0, sliderIndex - 1); updateSlider(); });
      if (nextBtn) nextBtn.addEventListener("click", () => {
        const visible = getVisibleCount();
        sliderIndex = Math.min(dates.length - visible, sliderIndex + 1);
        updateSlider();
      });

// Generate slots for morning (9 AM - 12 PM) and evening (4 PM - 9 PM)
const slots = [];

// Morning slots: 9 AM to 12 PM
for (let h = 9; h < 12; h++) {
  slots.push(`${h}:00 AM`);
  slots.push(`${h}:30 AM`);
}

// Evening slots: 4 PM to 9 PM
for (let h = 16; h < 21; h++) {
  const displayHour = h - 12; // Converts 16 to 4, 17 to 5, etc.
  slots.push(`${displayHour}:00 PM`);
  slots.push(`${displayHour}:30 PM`);
}

      function renderSlots() {
        slotGrid.innerHTML = slots.map(t => `
          <label class="time-pill">
            <input type="radio" name="time" value="${t}" />
            <span>${t}</span>
          </label>`).join("");
      }

      dates.forEach((d, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "date-btn" + (i === 0 ? " is-active" : "");
        if (i === 1) btn.setAttribute("data-tomorrow", "");
        const label = i === 0 ? "Today" : i === 1 ? "Tomorrow" : DAYS[d.getDay()];
        btn.innerHTML = `<span class="date-btn__label">${label}</span><span class="date-btn__num">${d.getDate()}</span><span class="date-btn__day">${MONTHS[d.getMonth()]}</span>`;
        btn.addEventListener("click", () => {
          row.querySelectorAll(".date-btn").forEach(b => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          document.getElementById("bookDate").value = formatValue(d);
        });
        row.appendChild(btn);
        if (i === 0) document.getElementById("bookDate").value = formatValue(d);
      });

      renderSlots();
      updateSlider();
    })();

    showPane(1);

    const n1 = document.getElementById("wizNext1");
    const n2 = document.getElementById("wizNext2");
    const b2 = document.getElementById("wizBack2");
    const b3 = document.getElementById("wizBack3");
    const sub = document.getElementById("wizSubmit");

    if (n1) n1.addEventListener("click", () => showPane(2));
    if (b2) b2.addEventListener("click", () => showPane(1));
    if (n2) n2.addEventListener("click", () => {
      // Validate: a time slot must be selected
      const selectedTime = document.querySelector('input[name="time"]:checked');
      if (!selectedTime) {
        const slotGrid = document.getElementById("slotGrid");
        if (slotGrid) {
          slotGrid.style.outline = "2px solid #e53e3e";
          slotGrid.style.borderRadius = "10px";
          // Show inline error
          let err = document.getElementById("slotError");
          if (!err) {
            err = document.createElement("p");
            err.id = "slotError";
            err.style.cssText = "color:#e53e3e;font-size:13px;font-weight:600;margin:8px 0 0;";
            err.textContent = "Please select a time slot to continue.";
            slotGrid.parentElement.appendChild(err);
          }
          slotGrid.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        return;
      }
      // Clear any error
      const slotGrid = document.getElementById("slotGrid");
      if (slotGrid) {
        slotGrid.style.outline = "";
        const err = document.getElementById("slotError");
        if (err) err.remove();
      }
      buildSummary();
      showPane(3);
    });
    if (b3) b3.addEventListener("click", () => showPane(2));
    if (sub) sub.addEventListener("click", () => {
      // Validate name and phone are filled
      const nameInput = document.querySelector('#wizPane3 input[name="name"]');
      const phoneInput = document.querySelector('#wizPane3 input[name="phone"]');
      let valid = true;

      [{input: nameInput, errId: "wizNameErr", msg: "Please enter your full name."},
       {input: phoneInput, errId: "wizPhoneErr", msg: "Please enter your phone number."}
      ].forEach(({input, errId, msg}) => {
        if (!input) return;
        let err = document.getElementById(errId);
        if (!input.value.trim()) {
          valid = false;
          input.style.borderColor = "#e53e3e";
          input.style.boxShadow = "0 0 0 3px rgba(229,62,62,.15)";
          if (!err) {
            err = document.createElement("p");
            err.id = errId;
            err.style.cssText = "color:#e53e3e;font-size:13px;font-weight:600;margin:4px 0 0;";
            err.textContent = msg;
            input.parentElement.after(err);
          }
        } else {
          input.style.borderColor = "";
          input.style.boxShadow = "";
          if (err) err.remove();
        }
      });

      if (!valid) {
        (nameInput && !nameInput.value.trim() ? nameInput : phoneInput).scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      showPane(4);
    });
  }

  function getPage() {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get("page") || "home";
    } catch (e) {
      return "home";
    }
  }

  function render() {
    const page = getPage();
    if (page === "contact") {
      app.innerHTML = contactPage();
    } else if (page === "about") {
      app.innerHTML = aboutPage();
    } else {
      app.innerHTML = homePage();
    }
    applySeo(page);
    bindUi();
  }

  applyTheme();
  injectSchema();
  render();
})();

    </script>
  </body>
</html>
